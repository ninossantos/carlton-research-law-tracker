name: Refresh tracker data

on:
  schedule:
    - cron: "0 14 * * 1"
  workflow_dispatch:

jobs:
  appeals:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Install PDF reader
        run: python3 -m pip install --user pypdf
      - name: Harvest CourtListener appeals
        env:
          COURTLISTENER_TOKEN: ${{ secrets.COURTLISTENER_TOKEN }}
        run: python3 scripts/refresh_appeals.py
      - name: Commit if the list moved
        run: |
          git config user.name "carlton-research-tracker"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/appeals.json public/data/appeals.json
          if git diff --staged --quiet; then
            echo "No appeals changes."
            exit 0
          fi
          git commit -m "Refresh coercive control appeals from CourtListener"
          git push
